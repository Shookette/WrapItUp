name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # Java 21 : requis par l'émulateur Firestore (tests des règles)
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      # build en mode preview : clé API « Dev / previews » (.env), le domaine
      # du canal de preview n'étant pas autorisé sur la clé de production
      # npm audit : seuil « critical », les 4 failles « high » connues viennent
      # de @grpc/grpc-js (Firestore côté Node), absent du bundle navigateur
      - run: npm ci && npm run format:check && npm run lint && npm run test:rules && npm audit --omit=dev --audit-level=critical && npm run build:preview
      - uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_WRAP_IT_UP_2D42A }}
          projectId: wrap-it-up-2d42a
