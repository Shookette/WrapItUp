name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # Java 21 : requis par l'émulateur Firestore (tests des règles)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # build en mode preview : clé API « Dev / previews » (.env), le domaine
      # du canal de preview n'étant pas autorisé sur la clé de production
      - run: npm ci && npm run format:check && npm run lint && npm run test:rules && npm run build:preview
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_WRAP_IT_UP_2D42A }}
          projectId: wrap-it-up-2d42a
